name: Ingesta y alertas
on:
  schedule:
    - cron: "0 10 * * *"   # 04:00 Guatemala; los archivos se regeneran ~03:00
  workflow_dispatch:
    inputs:
      months_back: { description: "Meses a revisar (0 = todo desde la fecha inicial)", default: "0" }
      since: { description: "Primer mes a cargar (AAAA-MM)", default: "2024-01" }
      force: { description: "Reprocesar aunque no hayan cambiado", type: boolean, default: false }
concurrency: { group: ingest, cancel-in-progress: false }
jobs:
  ingest:
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 340
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      EMBEDDINGS_PROVIDER: openai
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      MAIL_PROVIDER: resend
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      MAIL_FROM: ${{ vars.MAIL_FROM }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      APP_URL: ${{ vars.APP_URL }}
      API_URL: ${{ vars.API_URL }}
      DATA_FROM: "2024-01"
    steps:
      - uses: actions/checkout@v4
      - name: Verificar secretos
        run: |
          ok=1
          for v in DATABASE_URL OPENAI_API_KEY RESEND_API_KEY SECRET_KEY APP_URL API_URL MAIL_FROM; do
            if [ -z "${!v}" ]; then echo "::error::$v llega VACÍO al workflow (revisa Settings → Secrets and variables → Actions)"; ok=0; fi
          done
          case "$DATABASE_URL" in postgresql://*|postgres://*) ;; *) echo "::error::DATABASE_URL no empieza con postgresql://"; ok=0;; esac
          [ "$ok" = 1 ] || exit 1
          echo "Secretos presentes"
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r backend/requirements.txt
      - name: Ingesta + embeddings
        run: |
          cd backend
          ARGS="--months-back ${{ inputs.months_back || '2' }} --from ${{ inputs.since || '2024-01' }}"
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python -m app.cli ingest $ARGS
      - name: Alertas por correo
        run: cd backend && python -m app.cli alerts
