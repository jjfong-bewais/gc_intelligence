# fly launch --no-deploy --copy-config   (cambia `app` por un nombre único)
app = "gc-intelligence-api"
primary_region = "iad"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  GC_MODE = "prod"
  COOKIE_SECURE = "true"
  EMBEDDINGS_PROVIDER = "openai"
  MAIL_PROVIDER = "resend"
  DATA_YEAR = "2026"
  # CORS_ORIGINS, APP_URL, API_URL, COOKIE_DOMAIN: ver docs/DEPLOY.md

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.checks]
    [http_service.checks.health]
      grace_period = "20s"
      interval = "30s"
      method = "GET"
      path = "/api/v1/health"
      timeout = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
