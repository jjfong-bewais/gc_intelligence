# fly.toml app configuration file generated for gc-intelligence-api on 2026-11-06T02:04:42-06:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'gc-intelligence-api'
primary_region = 'iad'

[build]
  dockerfile = 'backend/Dockerfile'

[env]
  COOKIE_SECURE = 'true'
  DATA_YEAR = '2026'
  EMBEDDINGS_PROVIDER = 'openai'
  GC_MODE = 'prod'
  MAIL_PROVIDER = 'resend'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/v1/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
